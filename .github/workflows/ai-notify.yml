name: AI Commit Notifier

on:
  workflow_call:
    inputs:
      repo_name:
        required: true
        type: string
      branch:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      commit_message:
        required: true
        type: string
      pusher:
        required: true
        type: string
      files_added:
        required: false
        type: string
        default: "none"
      files_modified:
        required: false
        type: string
        default: "none"
      files_removed:
        required: false
        type: string
        default: "none"
      timestamp:
        required: true
        type: string
    secrets:
      GROQ_API_KEY:
        required: true
      SENDER_EMAIL:
        required: true
      SENDER_PASSWORD:
        required: true
      RECEIVER_EMAIL:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run AI analysis and send email
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          REPO_NAME: ${{ inputs.repo_name || github.repository }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
          COMMIT_MESSAGE: ${{ inputs.commit_message || github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ inputs.pusher || github.event.head_commit.author.name }}
          FILES_ADDED: ${{ inputs.files_added || join(github.event.head_commit.added, ', ') }}
          FILES_MODIFIED: ${{ inputs.files_modified || join(github.event.head_commit.modified, ', ') }}
          FILES_REMOVED: ${{ inputs.files_removed || join(github.event.head_commit.removed, ', ') }}
          TIMESTAMP: ${{ inputs.timestamp || github.event.head_commit.timestamp }}
        run: |
          python3 << 'EOF'
          import os, smtplib, requests
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime

          repo           = os.environ.get("REPO_NAME", "unknown")
          branch         = os.environ.get("BRANCH", "unknown")
          commit_sha     = os.environ.get("COMMIT_SHA", "")[:7]
          commit_msg     = os.environ.get("COMMIT_MESSAGE", "No message")
          author         = os.environ.get("COMMIT_AUTHOR", "unknown")
          files_added    = os.environ.get("FILES_ADDED", "none")
          files_modified = os.environ.get("FILES_MODIFIED", "none")
          files_removed  = os.environ.get("FILES_REMOVED", "none")
          timestamp      = os.environ.get("TIMESTAMP", "unknown")

          try:
              dt = datetime.fromisoformat(timestamp.replace("Z", "+00:00"))
              timestamp_nice = dt.strftime("%d %B %Y, %I:%M %p UTC")
          except:
              timestamp_nice = timestamp

          files_summary = f"Added: {files_added}\nModified: {files_modified}\nRemoved: {files_removed}"

          response = requests.post(
              "https://api.groq.com/openai/v1/chat/completions",
              headers={"Authorization": f"Bearer {os.environ['GROQ_API_KEY']}"},
              json={
                  "model": "llama-3.3-70b-versatile",
                  "messages": [{"role": "user", "content": f"Analyze this Git commit briefly in 5 lines.\nRepo: {repo}\nBranch: {branch}\nAuthor: {author}\nCommit: {commit_sha}\nMessage: {commit_msg}\nFiles:\n{files_summary}"}]
              }
          )
          ai_summary = response.json()["choices"][0]["message"]["content"]

          html = f"""
          <html><body style="font-family:Arial;padding:20px;">
          <h2>🚀 New Push — {repo}</h2>
          <table border="1" cellpadding="10" cellspacing="0" style="border-collapse:collapse;">
            <tr style="background:#f0f0f0;"><td><b>📁 Repository</b></td><td>{repo}</td></tr>
            <tr><td><b>🌿 Branch</b></td><td>{branch}</td></tr>
            <tr style="background:#f0f0f0;"><td><b>👤 Author</b></td><td>{author}</td></tr>
            <tr><td><b>🔖 Commit</b></td><td>{commit_sha}</td></tr>
            <tr style="background:#f0f0f0;"><td><b>🕐 Timestamp</b></td><td>{timestamp_nice}</td></tr>
            <tr><td><b>💬 Message</b></td><td>{commit_msg}</td></tr>
          </table>
          <h3>📂 Changed Files</h3>
          <table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;">
            <tr style="background:#d4edda;"><td><b>✅ Added</b></td><td>{files_added}</td></tr>
            <tr style="background:#fff3cd;"><td><b>✏️ Modified</b></td><td>{files_modified}</td></tr>
            <tr style="background:#f8d7da;"><td><b>🗑️ Removed</b></td><td>{files_removed}</td></tr>
          </table>
          <h3>🤖 AI Summary</h3>
          <p style="background:#e8f4fd;padding:15px;border-radius:8px;">{ai_summary}</p>
          </body></html>
          """

          msg = MIMEMultipart("alternative")
          msg["Subject"] = f"[{repo}] Push to {branch} by {author} — {commit_sha}"
          msg["From"]    = os.environ["SENDER_EMAIL"]
          msg["To"]      = os.environ["RECEIVER_EMAIL"]
          msg.attach(MIMEText(html, "html"))

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(os.environ["SENDER_EMAIL"], os.environ["SENDER_PASSWORD"])
              smtp.send_message(msg)

          print("✅ Email sent!")
          EOF
