name: AI Commit Notifier

on:
  push:
    branches: ["master", "main"]
  workflow_call:
    inputs:
      repo_name:
        required: true
        type: string
      branch:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      commit_message:
        required: true
        type: string
      pusher:
        required: true
        type: string
      files_added:
        required: false
        type: string
        default: "none"
      files_modified:
        required: false
        type: string
        default: "none"
      files_removed:
        required: false
        type: string
        default: "none"
      timestamp:
        required: true
        type: string
    secrets:
      GROQ_API_KEY:
        required: true
      SENDER_EMAIL:
        required: true
      SENDER_PASSWORD:
        required: true
      RECEIVER_EMAIL:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install groq

      - name: Run AI analysis and send email
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          REPO_NAME: ${{ inputs.repo_name || github.repository }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
          COMMIT_MESSAGE: ${{ inputs.commit_message || github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ inputs.pusher || github.event.head_commit.author.name }}
          FILES_ADDED: ${{ inputs.files_added || join(github.event.head_commit.added, ', ') }}
          FILES_MODIFIED: ${{ inputs.files_modified || join(github.event.head_commit.modified, ', ') }}
          FILES_REMOVED: ${{ inputs.files_removed || join(github.event.head_commit.removed, ', ') }}
          TIMESTAMP: ${{ inputs.timestamp || github.event.head_commit.timestamp }}
        run: python analyze.py
